name: Build Windows Executable

on:
  push:
    branches:
      - main
    paths:
      - '**.py' # Trigger only if Python files change

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x' # Use a specific version if needed, e.g., '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: pyinstaller --onefile --windowed main.py # Use --console if it's a console app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/main.exe # Path to the generated executable